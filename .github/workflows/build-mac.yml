name: Build Mac

# Runs on every tag push matching v*.*.* and also on a manual button click.
# Produces a Claude Usage.dmg attached to the GitHub release for tag pushes,
# and as a downloadable build artifact for manual runs.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write   # needed for upload to release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-mac.txt ]; then
            pip install -r requirements-mac.txt
          else
            echo "::warning::requirements-mac.txt not found yet -- using fallback list"
            pip install rumps httpx Pillow pync pyinstaller
          fi

      - name: Generate icons
        run: |
          if [ -f make_icon.py ]; then
            python make_icon.py
          fi
          # Convert app.ico -> app.icns (Mac uses .icns for app bundle icons).
          if [ ! -f app.icns ] && [ -f app.ico ]; then
            python make_icns.py
          fi

      - name: Build app bundle with PyInstaller
        run: |
          if [ ! -f claude_usage_menubar.py ]; then
            echo "::error::claude_usage_menubar.py not found -- the Mac source isn't in the repo yet."
            exit 1
          fi
          pyinstaller \
            --windowed \
            --onedir \
            --name "Claude Usage" \
            --icon app.icns \
            --osx-bundle-identifier com.diggystyon.claudeusage \
            --collect-data certifi \
            --noconfirm \
            claude_usage_menubar.py

      - name: Strip extended attributes
        run: |
          xattr -cr "dist/Claude Usage.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          # If you've shipped a custom DMG background image, it'll be picked up
          # here. Otherwise create-dmg uses a plain default.
          BG_ARG=""
          if [ -f dmg_bg.png ]; then
            BG_ARG="--background dmg_bg.png"
          fi
          create-dmg \
            --volname "Claude Usage" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Claude Usage.app" 175 190 \
            --hide-extension "Claude Usage.app" \
            --app-drop-link 425 190 \
            $BG_ARG \
            --no-internet-enable \
            "Claude Usage.dmg" \
            "dist/Claude Usage.app" \
            || true
          # create-dmg sometimes returns non-zero on cosmetic issues even when
          # the DMG is fine; verify the file exists.
          test -f "Claude Usage.dmg"

      - name: Upload as artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-DMG
          path: Claude Usage.dmg

      - name: Attach DMG to release (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Claude Usage.dmg
