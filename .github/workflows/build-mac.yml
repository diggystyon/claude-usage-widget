name: Build Mac

# Runs on every tag push matching v*.*.* and also on a manual button click.
# Produces TWO DMGs per release -- one for Apple Silicon, one for Intel --
# both attached to the GitHub release for tag pushes (and as downloadable
# artifacts for manual runs).
#
# Why a matrix instead of a lipo'd fat binary: PyInstaller can't produce a
# universal binary in one pass; you'd need to build separately per arch and
# splice the resulting Mach-O executables + Frameworks together by hand.
# The matrix approach is simpler and the user-facing UX is one extra
# decision at download time ("which one matches my Mac?") -- documented in
# README-MAC.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Let one arch finish even if the other fails. A partial release
      # (one arch attached, one missing) is worse than no release, but
      # MUCH better than zero builds finishing because Intel had a flake
      # in step 3.
      fail-fast: false
      matrix:
        include:
          # macos-latest currently resolves to an Apple Silicon (arm64)
          # runner. If GitHub flips that default in the future, pin to
          # macos-14 or macos-15 explicitly here.
          - runner: macos-latest
            arch: arm64
          # macos-13 is currently the youngest Intel-on-macOS runner image
          # GitHub publishes. Bump deliberately if/when GitHub retires it
          # (will likely surface as a "deprecated runner" warning weeks
          # before removal).
          - runner: macos-13
            arch: x86_64
    # Per-arch concurrency so a re-run of one arch doesn't queue behind
    # the other. cancel-in-progress stays false: we want both builds to
    # finish, not get killed when a newer tag lands minutes later.
    # Lives inside the job (not at workflow level) because matrix vars
    # aren't defined in the workflow scope.
    concurrency:
      group: build-mac-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write   # needed for upload to release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-mac.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin PyInstaller's major to keep --collect-data semantics stable.
          pip install "pyinstaller>=6.10,<7.0"
          if [ -f requirements-mac.txt ]; then
            pip install -r requirements-mac.txt
          else
            echo "::warning::requirements-mac.txt not found yet -- using fallback list"
            # pync intentionally dropped from the fallback list: we use
            # /usr/bin/osascript for notifications.
            pip install rumps httpx Pillow cryptography
          fi

      - name: Generate icons
        run: |
          if [ -f make_icon.py ]; then
            python make_icon.py
          fi
          # Convert app.ico -> app.icns (Mac uses .icns for app bundle icons).
          if [ ! -f app.icns ] && [ -f app.ico ]; then
            python make_icns.py
          fi

      - name: Build app bundle with PyInstaller
        run: |
          if [ ! -f claude_usage_menubar.py ]; then
            echo "::error::claude_usage_menubar.py not found -- the Mac source isn't in the repo yet."
            exit 1
          fi
          pyinstaller \
            --windowed \
            --onedir \
            --name "Claude Usage" \
            --icon app.icns \
            --osx-bundle-identifier com.diggystyon.claudeusage \
            --collect-data certifi \
            --collect-submodules cryptography \
            --noconfirm \
            claude_usage_menubar.py

      - name: Verify built arch matches runner
        run: |
          BIN="dist/Claude Usage.app/Contents/MacOS/Claude Usage"
          ACTUAL_ARCH=$(lipo -archs "$BIN" 2>/dev/null || file -b "$BIN")
          echo "Built binary arch: $ACTUAL_ARCH (expected: ${{ matrix.arch }})"
          case "${{ matrix.arch }}" in
            arm64)  echo "$ACTUAL_ARCH" | grep -q "arm64"  || { echo "::error::Expected arm64, got $ACTUAL_ARCH"; exit 1; } ;;
            x86_64) echo "$ACTUAL_ARCH" | grep -q "x86_64" || { echo "::error::Expected x86_64, got $ACTUAL_ARCH"; exit 1; } ;;
          esac

      - name: Strip extended attributes
        run: |
          xattr -cr "dist/Claude Usage.app"

      # Smoke test before DMG packaging: launch the built .app's binary
      # for 15s. If the widget crashes during init (bad import, missing
      # bundled data file, etc.) the process exits before our timer fires
      # and we surface stdout/stderr/log/crash-reports and fail the build.
      # We can't validate real Keychain access or live cookie reads here
      # -- no Claude desktop on a fresh runner -- but launch-time fatal
      # errors are exactly the class of regression this catches.
      - name: Smoke test the built .app
        run: |
          APP_BIN="dist/Claude Usage.app/Contents/MacOS/Claude Usage"
          if [ ! -f "$APP_BIN" ]; then
            echo "::error::No executable at $APP_BIN"
            ls -la "dist/Claude Usage.app/Contents/MacOS/" 2>&1 || true
            exit 1
          fi
          echo "Launching widget for 15s smoke test (arch=${{ matrix.arch }})..."
          "$APP_BIN" >app-stdout.log 2>app-stderr.log &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then
            echo "::notice::Widget alive after 15s (PID=$PID); smoke test passed"
            kill -TERM $PID 2>/dev/null || true
            sleep 2
            kill -KILL $PID 2>/dev/null || true
          else
            echo "::error::Widget exited or crashed during the 15s init window"
            echo "--- app stdout ---"; cat app-stdout.log 2>/dev/null || true
            echo "--- app stderr ---"; cat app-stderr.log 2>/dev/null || true
            echo "--- widget log ---"
            LOG="$HOME/Library/Application Support/ClaudeUsageTray/menubar.log"
            if [ -f "$LOG" ]; then tail -100 "$LOG"; else echo "(no log)"; fi
            echo "--- crash reports ---"
            ls -la "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null | grep -i claude || echo "(none)"
            exit 1
          fi
          # Surface ERROR lines from the widget log even on success, so
          # any unexpected init-time failure is visible in the build log.
          LOG="$HOME/Library/Application Support/ClaudeUsageTray/menubar.log"
          if [ -f "$LOG" ]; then
            ERRORS=$(grep -E '\[ERROR\]' "$LOG" || true)
            if [ -n "$ERRORS" ]; then
              echo "::warning::Widget log has ERROR lines (some are expected on a runner with no Claude install):"
              echo "$ERRORS" | head -20
            fi
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          # Per-arch DMG filename so the two matrix jobs don't overwrite
          # each other's artifact at upload time and so users can tell at
          # a glance which one matches their Mac.
          DMG_NAME="Claude Usage-${{ matrix.arch }}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

          BG_ARG=""
          if [ -f dmg_bg.png ]; then
            BG_ARG="--background dmg_bg.png"
          fi
          # create-dmg returns non-zero on cosmetic issues even when the DMG
          # is fine. We still verify the file exists below so a truly broken
          # run fails loudly rather than silently producing a half-DMG.
          create-dmg \
            --volname "Claude Usage" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Claude Usage.app" 175 190 \
            --hide-extension "Claude Usage.app" \
            --app-drop-link 425 190 \
            $BG_ARG \
            --no-internet-enable \
            "$DMG_NAME" \
            "dist/Claude Usage.app" \
            || true
          test -f "$DMG_NAME"

      - name: Upload as artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          # Per-arch artifact name -- otherwise the two matrix jobs would
          # try to upload to the same artifact and one would fail.
          name: Claude-Usage-DMG-${{ matrix.arch }}
          path: ${{ env.DMG_NAME }}

      # Third-party Action pinned to a specific patch version. Pin to SHA
      # if/when you want maximum supply-chain hygiene.
      - name: Attach DMG to release (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.1.0
        with:
          files: ${{ env.DMG_NAME }}
