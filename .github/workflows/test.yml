name: Tests

# Runs on every push and PR. Fast (under a minute) -- exercises the
# pure-Python logic in mac_cookie_sources.py that doesn't need macOS to
# test (PKCS#7 padding, AES-CBC roundtrip, PBKDF2 vector, sessionKey
# detection). Real macOS integration is covered by the post-build smoke
# test step in build-mac.yml.
on:
  push:
    branches:
      - main
      - 'audit-**'
      - 'mac-**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Just the deps the tests actually use. We don't need rumps /
          # pystray / pywin32 here because the tests only import the
          # pure-Python helpers, not the entry scripts.
          pip install pytest 'cryptography>=42.0.0'

      - name: Run pytest
        run: |
          python -m pytest tests/ -v
