name: Build Windows

# Runs on every tag push matching v*.*.* and on manual button clicks.
# Produces Claude Usage Setup.exe attached to the GitHub release on tag pushes,
# and as a downloadable build artifact on manual runs.
#
# Mirrors the local rebuild_and_install.bat pipeline:
#   1. Generate app.ico (make_icon.py)
#   2. PyInstaller bundles claude_usage_tray.py -> dist/Claude Usage.exe
#   3. Inno Setup compiles installer.iss -> installer_dist/Claude Usage Setup.exe
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Serialize concurrent tag pushes so two simultaneous releases can't race on
# the upload step. cancel-in-progress stays false: we want the older tag's
# build to finish, not get killed when a newer tag lands minutes later.
concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed for upload to release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cache pip's wheel download dir keyed on requirements.txt so
          # we don't re-fetch every release. ~30s shaved per build.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # PyInstaller pinned to a known-good major to avoid the recurring
          # "PyInstaller 6.x broke --collect-data semantics" surprise.
          # Bump deliberately, not implicitly.
          pip install "pyinstaller>=6.10,<7.0"
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Host "::warning::requirements.txt not found -- using fallback list"
            pip install httpx pystray Pillow pywin32 cryptography winotify
          }

      - name: Generate icon
        shell: pwsh
        run: |
          if (Test-Path make_icon.py) {
            python make_icon.py
          }

      # Read the version from _version.py (single source of truth) and
      # expose it as $env:APP_VERSION for the Inno Setup step below.
      - name: Read app version from _version.py
        shell: pwsh
        run: |
          $ver = python -c "from _version import __version__; print(__version__)"
          Write-Host "APP_VERSION=$ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          if (-not (Test-Path claude_usage_tray.py)) {
            Write-Host "::error::claude_usage_tray.py not found"
            exit 1
          }
          pyinstaller `
            --noconsole `
            --onefile `
            --name "Claude Usage" `
            --icon=app.ico `
            --add-data "app.ico;." `
            --hidden-import=win32crypt `
            --hidden-import=cryptography.hazmat.primitives.ciphers.aead `
            --hidden-import=winotify `
            --collect-data certifi `
            --distpath dist `
            --clean `
            --noconfirm `
            claude_usage_tray.py

      # Third-party Action pinned to a specific patch version. Major-only
      # pins (e.g. @v1) let the tag re-point under us and inherit code we
      # haven't reviewed. Pin SHA if/when you want maximum supply-chain
      # hygiene.
      - name: Compile installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer.iss
          # /DAppVersion injects the version read from _version.py above.
          # installer.iss has a #ifndef fallback for the dev-direct-invoke case.
          options: /O+ /DAppVersion=${{ env.APP_VERSION }}

      - name: Upload artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Usage-Setup
          path: installer_dist/Claude Usage Setup.exe

      - name: Attach .exe to release (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.1.0
        with:
          files: installer_dist/Claude Usage Setup.exe
